name = "route"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Statische bestanden uit public/. run_worker_first: de Worker draait vóór de pagina's en de API, zodat
# het Benelux-slot daar geldt. Vaste bestanden (iconen, scripts, busnet-tegels) gaan er rechtstreeks
# langs: die zijn gratis en tellen niet mee in de 100.000 verzoeken per dag van het gratis plan.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/*", "!/img/*", "!/vendor/*", "!/busnet/*", "!/routetekenaar/*", "!/favicon.ico", "!/robots.txt", "!/apple-touch-icon.png", "!/boord/modus.js"]

# KV: de netten (net/<id>) en de accounts. Maak in het NIEUWE Cloudflare-account een namespace aan
# (Storage & Databases -> KV -> Create, naam "eigennet") en plak de id hieronder.
[[kv_namespaces]]
binding = "EIGENNET"
id = "0831afc7d2414ddab3bbef451f02d10f"

# D1: de laatst gemelde positie van elke bus (tabel eigenpos, wordt vanzelf aangemaakt).
# Maak een database "eigennet" aan (Storage & Databases -> D1 -> Create) en plak de id hieronder.
[[d1_databases]]
binding = "DB"
database_name = "eigennet"
database_id = "155ef1f6-0630-440f-96c0-fb78afb9917d"

# Geen geplande taken nodig.

# Secrets (NIET hier invullen, wel in het dashboard: Settings -> Variables and Secrets):
#   AUTH_SECRET       lange willekeurige tekst; zonder deze staat de login uit en is alles open
#   ADMIN_WACHTWOORD  wachtwoord voor /admin
# Optioneel (gewone variabele): GEO_BENELUX = "1" om de site te beperken tot de Benelux.
